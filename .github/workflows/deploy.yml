name: Deploy to Hostinger cPanel

on:
  push:
    branches:
      - main # Triggers when you push or merge to the main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4
      
      - name: 🏗️ Setup Node.js (Dockerized environment)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'
          
      - name: 📦 Install Frontend Dependencies
        run: |
          cd client
          npm ci

      - name: 🛠️ Build React App
        run: |
          cd client
          npm run build

      - name: 📂 Prepare Deployment Folder
        run: |
          mkdir deploy_package
          # Copy the built React app to the root of the deployment package
          cp -r client/dist/* deploy_package/
          # Copy the PHP server backend
          cp -r server deploy_package/
          # Copy the widget script
          cp client/public/widget.js deploy_package/ 2>/dev/null || true
          # Copy the .htaccess for routing
          cp client/public/.htaccess deploy_package/ 2>/dev/null || true

      - name: 🔐 Inject Live Database Credentials
        run: |
          php -r '
            $f = "deploy_package/server/api/config.php";
            if (file_exists($f)) {
              $c = file_get_contents($f);
              $h = getenv("DB_HOST") ?: "localhost";
              $c = str_replace("\$host = '\''localhost'\'';", "\$host = '\''" . $h . "'\'';", $c);
              $c = str_replace("\$db   = '\''bee_chat'\'';", "\$db   = '\''" . getenv("DB_DB") . "'\'';", $c);
              $c = str_replace("\$user = '\''root'\'';", "\$user = '\''" . getenv("DB_USER") . "'\'';", $c);
              $c = str_replace("\$pass = '\'''\'';", "\$pass = '\''" . getenv("DB_PASS") . "'\'';", $c);
              file_put_contents($f, $c);
            }
          '
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_DB: ${{ secrets.DB_DATABASE }}
          DB_USER: ${{ secrets.DB_USERNAME }}
          DB_PASS: ${{ secrets.DB_PASSWORD }}

      - name: 🚀 Sync to Hostinger cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          security: loose
          port: 21
          timeout: 600000
          local-dir: ./deploy_package/
          server-dir: ./ # Hostinger FTP accounts usually open directly in public_html
