<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="megaKawaiiFuzzLogin" x="-50%" y="-50%" width="200%" height="200%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" />
    </filter>
    <linearGradient id="megaHoneyLogin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFBEB" />
      <stop offset="40%" stopColor="#FEF3C7" />
      <stop offset="80%" stopColor="#F59E0B" />
      <stop offset="100%" stopColor="#92400E" />
    </linearGradient>
    <radialGradient id="kawaiiEyeLogin" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stopColor="#4B5563" />
      <stop offset="60%" stopColor="#111827" />
      <stop offset="100%" stopColor="#000000" />
    </radialGradient>
    <radialGradient id="deepBlushLogin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FF85A2" stopOpacity="0.8" />
      <stop offset="100%" stopColor="#FF85A2" stopOpacity="0" />
    </radialGradient>
  </defs>

  <!-- Wings -->
  <g transform="scale(0.5) translate(40, 20)">
    <path d="M40 40C20 10 0 20 0 40C0 60 20 80 40 60C60 80 80 60 80 40C80 20 60 10 40 40Z" fill="#FDF2F8" fillOpacity="0.5" stroke="#FBCFE8" strokeWidth="1" />
  </g>

  <!-- Body -->
  <g>
    <circle cx="75" cy="75" r="30" fill="url(#megaHoneyLogin)" filter="url(#megaKawaiiFuzzLogin)" />
    <path d="M85 55Q95 55 100 75L95 100Q85 105 75 100" fill="#1F2937" fillOpacity="0.9" />
    <path d="M100 65Q110 70 115 80L108 95Q100 100 92 95" fill="#1F2937" fillOpacity="0.9" />
    <circle cx="102" cy="75" r="2" fill="#000" />
  </g>

  <!-- Head & Face -->
  <g>
    <circle cx="40" cy="60" r="35" fill="url(#megaHoneyLogin)" filter="url(#megaKawaiiFuzzLogin)" />
    <circle cx="40" cy="60" r="32" fill="url(#megaHoneyLogin)" fillOpacity="0.2" />
    <circle cx="15" cy="70" r="10" fill="url(#deepBlushLogin)" />
    <circle cx="65" cy="70" r="10" fill="url(#deepBlushLogin)" />
    <g>
      <circle cx="22" cy="55" r="16" fill="url(#kawaiiEyeLogin)" />
      <circle cx="16" cy="48" r="7" fill="white" fillOpacity="0.95" />
      <circle cx="28" cy="60" r="3" fill="white" fillOpacity="0.6" />
      <path d="M10 55Q12 50 14 55" stroke="white" strokeWidth="1" strokeLinecap="round" opacity="0.3" />
      <circle cx="58" cy="55" r="16" fill="url(#kawaiiEyeLogin)" />
      <circle cx="52" cy="48" r="7" fill="white" fillOpacity="0.95" />
      <circle cx="64" cy="60" r="3" fill="white" fillOpacity="0.6" />
      <path d="M46 55Q48 50 50 55" stroke="white" strokeWidth="1" strokeLinecap="round" opacity="0.3" />
    </g>
    <path d="M36 75Q38 78 40 75Q42 78 44 75" stroke="#451A03" strokeWidth="2.5" strokeLinecap="round" fill="none" />
    <g>
      <path d="M30 35Q25 10 15 15" stroke="#1F2937" strokeWidth="3" strokeLinecap="round" fill="none" />
      <path d="M50 35Q55 10 65 15" stroke="#1F2937" strokeWidth="3" strokeLinecap="round" fill="none" />
      <path d="M15 15L17 13L15 11L13 13Z" fill="#FF85A2" />
      <path d="M65 15L67 13L65 11L63 13Z" fill="#FF85A2" />
    </g>
