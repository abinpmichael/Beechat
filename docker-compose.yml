version: '3.8'

services:
  # PHP Apache Server
  app:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ./server:/var/www/html
    environment:
      - DB_HOST=db
      - DB_NAME=bee_chat
      - DB_USER=root
      - DB_PASSWORD=password
    depends_on:
      - db

  # MySQL Database
  db:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      - MYSQL_DATABASE=bee_chat
      - MYSQL_ROOT_PASSWORD=password
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
